<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reisekasse</title>
<meta name="description" content="Reiseausgaben erfassen, Budget im Blick behalten und abrechnen.">
<meta name="theme-color" content="#EEF2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reisekasse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app"></div>

<nav class="tabs" aria-label="Bereiche">
  <div class="inner">
    <button class="tab" data-tab="overview"><span class="g">◔</span>Übersicht</button>
    <button class="tab" data-tab="list"><span class="g">☰</span>Ausgaben</button>
    <button class="add" id="addBtn" aria-label="Ausgabe erfassen">+</button>
    <button class="tab" data-tab="settle"><span class="g">⇄</span>Abrechnung</button>
    <button class="tab" data-tab="trip"><span class="g">⚙</span>Reise</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Ausgabe erfassen"><div class="inner" id="sheetInner"></div></div>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastUndo">Rückgängig</button></div>
<input type="file" id="fileIn" hidden>

<noscript><p style="padding:16px">Die Reisekasse braucht JavaScript.</p></noscript>
<script src="sync.js"></script>
<script src="csv.js"></script>
<script src="app.js"></script>
</body>
</html>
